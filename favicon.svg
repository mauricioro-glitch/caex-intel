<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified globe icon for favicon -->
  <g transform="translate(50, 50)">
    <!-- Globe circle with gradient effect -->
    <defs>
      <radialGradient id="faviconGrad" cx="30%" cy="30%">
        <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
      </radialGradient>
    </defs>
    
    <circle cx="0" cy="0" r="42" fill="url(#faviconGrad)"/>
    
    <!-- Ocean overlay -->
    <circle cx="0" cy="0" r="42" fill="#0277BD" opacity="0.2"/>
    
    <!-- Grid lines -->
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="42" ry="21" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="21" ry="42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    
    <!-- LATAM landmass - scaled up -->
    <path d="M -8 -18 L -4 -22 L 1 -23 L 5 -20 L 8 -15 L 10 -8 L 10 0 L 9 9 L 6 15 L 4 20 L 1 23 L -1 22 L -4 18 L -6 11 L -8 4 L -9 -5 L -8 -18 Z" 
          fill="#C8E6C9" opacity="0.95"/>
    
    <!-- Forest detail - scaled up -->
    <path d="M -4 -13 L 0 -15 L 4 -13 L 4 -6 L 1 0 L 0 3 L -3 0 L -4 -6 Z" 
          fill="#1B5E20" opacity="0.7"/>
    
    <!-- Highlight -->
    <circle cx="-15" cy="-15" r="9" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
