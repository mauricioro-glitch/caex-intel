<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAEX Intelligence | Carbon Market Data</title>

<meta name="description"
content="Daily carbon market intelligence from Verra projects, issuances and retirements.">

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#f8fafc;
color:#111827;
}

header{
background:#0f172a;
color:white;
padding:60px 20px;
text-align:center;
}

h1{
font-size:48px;
margin-bottom:10px;
}

.subtitle{
font-size:20px;
opacity:0.9;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.metric{
font-size:42px;
font-weight:bold;
margin-top:10px;
}

.newsletter{
background:white;
padding:40px;
margin-top:40px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

input{
padding:12px;
width:300px;
max-width:100%;
}

button{
padding:12px 20px;
background:#16a34a;
color:white;
border:none;
cursor:pointer;
}

footer{
margin-top:60px;
padding:40px;
text-align:center;
color:#666;
}

</style>

</head>

<body>

<header>

<h1>CAEX Intelligence</h1>

<p class="subtitle">
Carbon market data and intelligence powered by Verra registry analytics
</p>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Projects</h3>
<div class="metric">4,144</div>
</div>

<div class="card">
<h3>Issuances</h3>
<div class="metric">11,194</div>
</div>

<div class="card">
<h3>Retirements</h3>
<div class="metric">69,474</div>
</div>

</div>

<div class="newsletter">

<h2>Weekly Carbon Intelligence</h2>

<p>
Receive weekly insights on carbon markets,
buyers, methodologies and retirement trends.
</p>

<input
type="email"
placeholder="Your email">

<button>
Subscribe
</button>

</div>

</div>

<footer>

CAEX Intelligence © 2026

</footer>

</body>
</html>
